# Sun UI - CI Pipeline
#
# Runs on every push and PR to main:
# - Lint and type check
# - Unit tests (Vitest + jsdom)
# - Storybook component tests (Vitest browser mode, Chromium)
# - Build of every package and app
# - Visual review on Chromatic (does not fail the run when CHROMATIC_PROJECT_TOKEN is not set)
#
# pnpm/action-setup reads the pnpm version from "packageManager" in package.json.
# Workspace packages resolve to their dist/ builds, so every job that imports them
# builds the packages first.

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Cancel previous runs if a new commit is pushed to the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Lint
        run: pnpm lint

      # turbo builds workspace dependencies first (type-check dependsOn ^build)
      - name: Run Type Check
        run: pnpm type-check

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Packages
        run: pnpm build:packages

      - name: Run Unit Tests
        run: pnpm test:ci

  storybook-tests:
    name: Storybook Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Packages
        run: pnpm build:packages

      - name: Install Playwright Browsers
        run: pnpm exec playwright install chromium --with-deps

      # Runs every story as a test (render + play functions) in headless Chromium
      - name: Run Storybook Tests
        run: pnpm test:storybook:ci

      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: storybook-test-results
          path: |
            apps/docs/test-results/
            apps/docs/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  visual-tests:
    name: Visual Tests (Chromatic)
    runs-on: ubuntu-latest
    needs: [unit-tests, storybook-tests]
    # Only run on main branch or PRs (skip forks for security)
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Required for Chromatic to detect changes

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm turbo run build --filter=docs

      - name: Publish to Chromatic
        uses: chromaui/action@v17
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          storybookBuildDir: ./apps/docs/storybook-static
          onlyChanged: true
          exitZeroOnChanges: true
          exitOnceUploaded: true
        continue-on-error: true # Don't fail CI if Chromatic is not configured

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Packages and Apps
        run: pnpm build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            packages/*/dist/
            apps/docs/storybook-static/
          retention-days: 7
